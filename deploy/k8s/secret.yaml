apiVersion: v1
kind: Secret
metadata:
  name: 9router-secret
  namespace: 9router
  labels:
    app.kubernetes.io/name: 9router
    app.kubernetes.io/part-of: 9router-gateway
type: Opaque
stringData:
  # Clustered database connection string (use Postgres in production multi-replica clusters)
  # DATABASE_URL: "postgres://ninerouter:change-me-secret@postgres-service.9router.svc.cluster.local:5432/ninerouter"
  
  # Security tokens and master secrets
  JWT_SECRET: "replace-with-long-random-jwt-secret-string-32-chars-min"
  INITIAL_PASSWORD: "replace-with-strong-admin-initial-password"
  ADMIN_API_TOKEN: "replace-with-dedicated-service-admin-token"
  API_KEY_SECRET: "replace-with-encryption-salt-for-api-keys"
  MACHINE_ID_SALT: "replace-with-unique-cluster-machine-id-salt"
