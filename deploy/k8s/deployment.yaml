apiVersion: apps/v1
kind: Deployment
metadata:
  name: 9router
  namespace: 9router
  labels:
    app.kubernetes.io/name: 9router
    app.kubernetes.io/part-of: 9router-gateway
    app.kubernetes.io/version: "0.6.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: 9router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: 9router
        app.kubernetes.io/part-of: 9router-gateway
        app.kubernetes.io/version: "0.6.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "20127"
        prometheus.io/path: "/api/health"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: 9router
          image: mihir0209/9router:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 20127
              protocol: TCP
          envFrom:
            - configMapRef:
                name: 9router-config
            - secretRef:
                name: 9router-secret
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: data-volume
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
