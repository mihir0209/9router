apiVersion: v1
kind: Service
metadata:
  name: 9router-loadbalancer
  namespace: 9router
  labels:
    app.kubernetes.io/name: 9router
    app.kubernetes.io/part-of: 9router-gateway
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: 9router
  ports:
    - name: http
      port: 20127
      targetPort: http
      protocol: TCP
