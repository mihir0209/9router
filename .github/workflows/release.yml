name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.6.0). Defaults to the current ref if omitted."
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: 9r-linux-x64
            use_cross_action: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: 9r-linux-arm64
            use_cross_action: true
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: 9r-darwin-x64
            use_cross_action: false
          - target: aarch64-apple-darwin
            os: macos-14
            artifact_name: 9r-darwin-arm64
            use_cross_action: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: 9r-windows-x64.exe
            use_cross_action: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup cross-compilation toolchain
        if: matrix.use_cross_action
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path rust/app/Cargo.toml

      - name: Prepare release artifact
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            SRC="rust/app/target/${{ matrix.target }}/release/9r.exe"
          else
            SRC="rust/app/target/${{ matrix.target }}/release/9r"
          fi

          if [ ! -f "$SRC" ]; then
            echo "::error::Compiled binary not found at $SRC"
            exit 1
          fi

          DEST="dist/${{ matrix.artifact_name }}"
          cp "$SRC" "$DEST"

          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            chmod +x "$DEST"
          fi

          echo "Prepared artifact at $DEST ($(ls -lh "$DEST" | awk '{print $5}'))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG" ]; then
            echo "::error::Release tag cannot be empty."
            exit 1
          fi
          echo "Preparing release for tag: $TAG"

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify downloaded assets
        run: |
          echo "Downloaded assets:"
          ls -lh release-assets/

          REQUIRED_ASSETS=(
            "9r-linux-x64"
            "9r-linux-arm64"
            "9r-darwin-x64"
            "9r-darwin-arm64"
            "9r-windows-x64.exe"
          )

          for asset in "${REQUIRED_ASSETS[@]}"; do
            if [ ! -f "release-assets/$asset" ]; then
              echo "::error::Missing required release asset: release-assets/$asset"
              exit 1
            fi
          done

          echo "All 5 required release binaries are verified present."

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          sha256sum \
            9r-linux-x64 \
            9r-linux-arm64 \
            9r-darwin-x64 \
            9r-darwin-arm64 \
            9r-windows-x64.exe > checksums.txt

          echo "Generated checksums.txt:"
          cat checksums.txt

          echo "Verifying checksums against binaries:"
          sha256sum -c checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            release-assets/9r-linux-x64
            release-assets/9r-linux-arm64
            release-assets/9r-darwin-x64
            release-assets/9r-darwin-arm64
            release-assets/9r-windows-x64.exe
            release-assets/checksums.txt
          generate_release_notes: true
          draft: false

      - name: Write Release Summary
        run: |
          {
            echo "### 9Router Multi-Platform Release Assets"
            echo ""
            echo "| Asset Name | Target Platform | Architecture | Binary Format |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| \`9r-linux-x64\` | Linux | x86_64 | musl static ELF executable |"
            echo "| \`9r-linux-arm64\` | Linux | aarch64 | musl static ELF executable |"
            echo "| \`9r-darwin-x64\` | macOS | x86_64 | Mach-O 64-bit executable |"
            echo "| \`9r-darwin-arm64\` | macOS | arm64 | Mach-O 64-bit arm64 executable |"
            echo "| \`9r-windows-x64.exe\` | Windows | x64 | PE32+ MSVC executable |"
            echo "| \`checksums.txt\` | All | All | SHA-256 Checksums |"
            echo ""
            echo "#### SHA-256 Checksums"
            echo '```'
            cat release-assets/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
