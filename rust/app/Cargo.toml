[package]
name = "ninerouter"
version = "0.6.0"
edition = "2024"
publish = false
description = "Native Rust core for 9Router: single-binary high-performance AI Gateway and dashboard"

[lib]
name = "ninerouter"
path = "src/lib.rs"

[[bin]]
name = "9r"
path = "src/main.rs"

[dependencies]
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "client", "client-legacy"] }
http-body-util = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
async-stream = "0.3"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rust-embed = { version = "8.14", features = ["compression"] }
mime_guess = "2.0"
dashmap = "6.1"
ring = "0.17"
base64 = "0.22"
bcrypt = "0.19.3"
url = "2.5"
percent-encoding = "2.3"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
tokio-rustls = "0.26.6"
rustls = "0.23.46"
rustls-pki-types = "1.16.0"
r2d2 = "0.8.10"

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
