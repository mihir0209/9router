name = "mihir-router"
main = ".open-next/worker.js"
workers_dev = true
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "mihir-router"

[vars]
NODE_ENV = "production"
NEXTJS_ENV = "production"
NINEROUTER_RUNTIME = "cloudflare"

# Flush in-memory analytics buffer + observability batch before isolate eviction.
[triggers]
crons = ["*/10 * * * *"]

[[durable_objects.bindings]]
name = "GATEWAY_COORDINATOR"
class_name = "GatewayCoordinator"

[exports.GatewayCoordinator]
type = "durable-object"
storage = "sqlite"

[observability]
enabled = true
head_sampling_rate = 0.25

[observability.logs]
enabled = true
head_sampling_rate = 0.25
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1
persist = true

[[d1_databases]]
binding = "DB"
database_name = "mihir-router-db"
database_id = "3fd32503-00aa-4de3-9118-50169a43476f"

# Optional cache bucket for OpenNext incremental cache.
# [[r2_buckets]]
# binding = "NEXT_INC_CACHE_R2_BUCKET"
# bucket_name = "9router-next-cache"
