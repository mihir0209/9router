name = "mihir-router"
main = ".open-next/worker.js"
workers_dev = true
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "mihir-router"

[vars]
NODE_ENV = "production"
NEXTJS_ENV = "production"
NINEROUTER_RUNTIME = "cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "mihir-router-db"
database_id = "3fd32503-00aa-4de3-9118-50169a43476f"

# Optional cache bucket for OpenNext incremental cache.
# [[r2_buckets]]
# binding = "NEXT_INC_CACHE_R2_BUCKET"
# bucket_name = "9router-next-cache"
